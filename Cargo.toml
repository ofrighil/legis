[workspace]
members = ["crates/legis-core", "crates/legis"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
legis-core = { path = "crates/legis-core" }
jiff = { version = "0.2.40", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ureq = "3.5.1"
